<style>/* Adas Körper-Atlas – Gestaltung */
:root {
  color-scheme: light;
  --bg: #FBF7F1; --card: #FFFFFF; --ink: #1E2433; --muted: #5F6B7A; --line: #E7DFD3; --soft: #F4EEE4;
  --pri: #1F5FAD; --pri-d: #174A87; --pri-l: #E8F0FB;
  --ok: #15803D; --ok-bg: #E8F6EC; --part: #A85A08; --part-bg: #FFF3DC; --no: #B42318; --no-bg: #FDECEA;
  --hl: #C6F23C; --hl-d: #4D7C0F; --sel: #7DD3FC; --sel-d: #0369A1;
  --r: 16px; --sh: 0 1px 2px rgba(30, 36, 51, .06), 0 6px 18px rgba(30, 36, 51, .06);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.55; }
a { color: var(--pri); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #F59E0B; outline-offset: 2px; border-radius: 6px; }
b, strong { font-weight: 700; }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 20; background: rgba(251, 247, 241, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 18px; }
.logo svg { width: 34px; height: 34px; }
.top nav { margin-left: auto; display: flex; gap: 6px; }
.top nav a { text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; }
.top nav a:hover { background: var(--soft); }
#storenote { max-width: 1040px; margin: 8px auto 0; padding: 8px 14px; background: var(--part-bg); color: #7A4304; border-radius: 12px; font-size: 14px; }
main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }

/* Seiten */
.page h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 6px; }
.phead { margin-bottom: 14px; }
.back { display: inline-block; text-decoration: none; font-weight: 700; color: var(--muted); font-size: 15px; padding: 6px 0; background: none; border: 0; }
.lead { font-size: 17.5px; color: #2D3445; margin: 4px 0 16px; }
.sub, .muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 14.5px; margin: 6px 0; }
.sec { font-size: 20px; margin: 26px 0 10px; }
.center { text-align: center; }
.empty { padding: 30px; text-align: center; background: var(--card); border-radius: var(--r); }
.bar { height: 8px; background: #ECE5D9; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pri); border-radius: 99px; transition: width .3s; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; text-decoration: none; transition: transform .08s, background .15s; }
.btn:hover { background: var(--soft); }
.btn:active { transform: scale(.98); }
.btn[aria-pressed=true] { background: var(--pri-l); border-color: #8FB2E6; color: var(--pri-d); }
.btn.primary { background: var(--pri); border-color: var(--pri); color: #fff; }
.btn.primary:hover { background: var(--pri-d); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn.danger { border-color: #F3B8B2; color: var(--no); }
.btn[disabled] { opacity: .45; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.linkbtn { background: none; border: 0; color: var(--pri); font-weight: 700; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* Start */
.hero { display: flex; gap: 18px; align-items: center; background: linear-gradient(135deg, #FFFFFF, #F1F7FF); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: var(--sh); }
.hero h1 { font-size: 32px; margin: 2px 0 6px; }
.hero p { margin: 0; color: #2D3445; }
.eyebrow { font-size: 13px !important; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--pri) !important; margin-bottom: 4px !important; }
.ring-w { position: relative; width: 112px; height: 112px; flex: 0 0 auto; margin-left: auto; }
.ring-p { width: 112px; height: 112px; transform: rotate(-90deg); }
.rbg { fill: none; stroke: #E6EDF7; stroke-width: 12; }
.rfg { fill: none; stroke: var(--pri); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray .6s; }
.ring-l { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-l b { font-size: 24px; line-height: 1; }
.ring-l small { color: var(--muted); }
.reco { display: flex; align-items: center; gap: 14px; margin: 16px 0 4px; padding: 14px 18px; background: #FFF8E6; border: 2px solid #F6D98B; border-radius: 18px; text-decoration: none; color: var(--ink); }
.reco small { display: block; color: #8A5A00; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
.reco b { display: block; font-size: 18px; }
.reco-i { font-size: 30px; }
.go { margin-left: auto; font-size: 22px; color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mode { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-height: 120px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); box-shadow: var(--sh); transition: transform .1s; }
.mode:hover { transform: translateY(-2px); }
.mode .mi { font-size: 28px; }
.mode b { font-size: 18px; }
.mode span:last-child { color: var(--muted); font-size: 14.5px; }
.badge { display: inline-block; min-width: 24px; padding: 1px 7px; border-radius: 99px; background: var(--no); color: #fff; font-size: 13px; text-align: center; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kcard { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--r); text-decoration: none; color: var(--ink); box-shadow: var(--sh); }
.kcard b { font-size: 17px; line-height: 1.25; }
.kcard small { color: var(--muted); font-size: 13.5px; }
.kcard .bar > i, .krow .bar > i { background: var(--c); }
.kn { position: absolute; top: 10px; right: 12px; font-weight: 800; color: var(--c); font-size: 15px; }
.kcard .ic { width: 30px; height: 30px; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.foot { margin-top: 28px; text-align: center; }

/* Listen */
.klist { display: flex; flex-direction: column; gap: 10px; }
.krow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.krow .kn { position: static; font-size: 20px; width: 26px; text-align: center; }
.krow .kt { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.krow small { color: var(--muted); font-size: 14px; }
.mixbtn { display: block; margin: 4px 0 14px; padding: 14px 18px; border-radius: 16px; background: var(--pri-l); border: 2px solid #BFD3F2; color: var(--pri-d); font-weight: 800; text-decoration: none; }

/* Kapitel */
.kaphead { background: var(--c); color: #fff; border-radius: 22px; padding: 14px 20px 20px; margin-bottom: 16px; }
.kaphead .back { color: rgba(255, 255, 255, .9); }
.kh { display: flex; align-items: center; gap: 14px; }
.kh h1 { margin: 0; font-size: 30px; }
.kh p { margin: 2px 0 0; opacity: .92; font-size: 15px; }
.kh .ic { width: 40px; height: 40px; flex: 0 0 auto; }
.kn.big { position: static; color: #fff; font-size: 34px; opacity: .9; }
.lzbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 18px; }
.lzl { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
.lzl label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.lzl input { width: 22px; height: 22px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--c); }
.lzl .bar { margin: 6px 0 0 32px; height: 6px; }
.lzl .bar > i { background: var(--c); }
.blocks { display: flex; flex-direction: column; gap: 14px; }
.lp { margin: 0; font-size: 17.5px; }
.lh { font-size: 21px; margin: 14px 0 0; padding-bottom: 4px; border-bottom: 3px solid var(--c); align-self: flex-start; }
.box { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line); background: var(--card); }
.box .bx-t, .bx-t { font-weight: 800; font-size: 14px; letter-spacing: .02em; margin-bottom: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.merk { background: #FFF9E0; border-color: #F2DC8C; }
.heft { background: #F1F4F9; border-color: #D3DBE8; }
.extra { background: #EAF7F4; border-color: #BFE3DA; }
.achtung { background: #FFF1E3; border-color: #F5CDA3; }
.esel { background: #F3EEFC; border-color: #D9CCF5; }
.stolper { background: #FDECEF; border-color: #F4C1CB; }
.alltag { background: #EEF6FF; border-color: #C9DDF5; }
.tryit { background: #F2F8EA; border-color: #CFE5B5; }
.versuch { background: #F5F2FF; border-color: #D8D0F5; }
.vsteps { margin: 6px 0; padding-left: 22px; }
.vsteps li { margin: 4px 0; }
.srcb { display: inline-block; font-size: 12px; font-weight: 700; color: #55657A; background: #EEF2F7; border-radius: 99px; padding: 1px 8px; vertical-align: middle; white-space: nowrap; }
.srcline { margin: -6px 0 0; }
.zgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.zcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; }
.zcard b { font-size: 24px; color: var(--c); line-height: 1.15; }
.zcard span { font-weight: 700; }
.zcard small { color: var(--muted); font-size: 13.5px; }
.tblw { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
.tbl { border-collapse: collapse; width: 100%; font-size: 15px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--soft); font-size: 13.5px; }
.tbl tr:last-child td { border-bottom: 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ocard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.oc-h { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.oi { font-size: 22px; }
.ocard p { margin: 6px 0 4px; font-style: italic; }
.ocard small { color: #3E4A5B; font-size: 14px; display: block; }
.stations { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; }
.stations li { display: flex; gap: 12px; padding: 10px 0 10px 0; border-left: 3px dashed var(--c); margin-left: 16px; padding-left: 14px; position: relative; }
.stations .si { position: absolute; left: -19px; top: 8px; background: var(--bg); font-size: 20px; }
.stations li > div { padding-left: 12px; }
.stations p { margin: 2px 0 0; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cn { background: var(--card); border: 2px solid var(--c); border-radius: 99px; padding: 6px 12px; font-weight: 700; }
.ca { color: var(--muted); font-weight: 800; }
.szenen { display: grid; gap: 10px; }
.szene { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.szene summary { cursor: pointer; font-weight: 700; padding: 10px 0; list-style: none; }
.szene summary::-webkit-details-marker { display: none; }
.szene summary em { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.szene[open] summary em { display: none; }
.kapend { margin-top: 26px; padding-top: 10px; border-top: 2px solid var(--line); }
.pnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; font-weight: 700; }
.pnav a { text-decoration: none; }

/* Grafiken */
.fig { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.fig figcaption { color: var(--muted); font-size: 14px; margin-top: 8px; }
.fig-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.tbtn { min-height: 40px; padding: 6px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 14.5px; }
.tbtn[aria-pressed=false] { background: #FFF3DC; border-color: #F1CF8E; }
.fig-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.fig-svg svg, .wsvg svg, .qimg svg, .plain svg { display: block; width: 100%; height: auto; max-height: 72vh; margin: 0 auto; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 72vh; overflow: auto; }
.legend li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.legend li:hover, .legend li.on { background: #F3FBDF; }
.legend .ln { flex: 0 0 26px; height: 26px; border-radius: 50%; background: #1E2433; color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.legend .lt { display: flex; flex-direction: column; }
.legend small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.legend.hidden-names .nm { color: transparent; background: #E9E3D8; border-radius: 6px; }
.legend.hidden-names small { visibility: hidden; }
.legend.hidden-names li.on .nm { color: inherit; background: none; }
.legend.hidden-names li.on small { visibility: visible; }
.fig-info { margin-top: 8px; padding: 8px 12px; background: #F6F9EE; border-radius: 10px; min-height: 40px; font-size: 15.5px; }

/* SVG-Stil */
.dg { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.dg text { font-family: var(--font); }
.dtx { font-size: 11px; fill: #4A5568; font-weight: 700; }
.dtx.small { font-size: 9.5px; font-weight: 600; }
.dg.quiz .lbl { display: none; }
.bo { fill: none; stroke: #8B7A5E; stroke-linecap: round; stroke-linejoin: round; }
.bi { fill: none; stroke: #F6EDDA; stroke-linecap: round; stroke-linejoin: round; }
.bf { fill: #F6EDDA; stroke: #8B7A5E; stroke-width: 1.2; }
.bf2 { fill: #EFE3C6; }
.bf3 { fill: #FBF3E3; }
.hole { fill: #FFFFFF; stroke: #8B7A5E; stroke-width: 1; }
.sk-d { fill: #5A4A38; }
.sk-l { fill: none; stroke: #8B7A5E; stroke-width: 1; }
.cart { fill: none; stroke: #CDBF9F; stroke-width: 2.4; stroke-linecap: round; }
.hit { fill: none; stroke: transparent; pointer-events: stroke; }
.hitr { fill: transparent; }
.part { cursor: pointer; }
.ear-bg { fill: #FBEDE3; }
.ear-skin { fill: #F2C9A8; stroke: #A9785C; stroke-width: 1.3; }

.ear-coch { fill: #F3E2BD; stroke: #A98946; stroke-width: 1.4; fill-rule: evenodd; }
.ear-canals { fill: none; stroke: #A98946; stroke-width: 4; stroke-linecap: round; }

.brk { fill: none; stroke: #B9AE9D; stroke-width: 1.4; }

.brain2 { fill: #E9B0B0; }

.trach { fill: #CFDDF0; stroke: #6F8FB5; stroke-width: 1.1; }
.trach-l { stroke: #8FA9CC; stroke-width: 1; }

        { t: 'achtung', h: '<b>Zählweise vom Blatt:</b> Das Blatt zählt manche Knochen einzeln, die bei Erwachsenen zusammengewachsen sind – zum Beispiel das <b>Becken (3 + 3)</b> und die <b>Wirbelsäule (33)</b>. So kommt es auf <b>213</b>. Fachbücher nennen für Erwachsene meist <b>206</b>. Für die Arbeit: Das Blatt sagt „<b>zwischen 206 und 220</b>“, das Skelett auf dem Blatt hat <b>213</b>.' },
        { t: 'esel', h: '<b>Finger und Zehen haben je 14 Knochen:</b> Daumen und großer Zeh haben 2 Glieder, alle anderen 3 → 2 + 3 + 3 + 3 + 3 = <b>14</b>.<br><b>Hand:</b> Handwurzel → Mittelhand → Finger (8 + 5 + 14 = 27).<br><b>Fuß:</b> Fußwurzel → Mittelfuß → Zehen (7 + 5 + 14 = 26).' },
        { t: 'esel', h: 'Die <b>Elle</b> bildet die Spitze vom <b>Ell</b>enbogen und liegt auf der Seite vom kleinen Finger. Die <b>Speiche</b> liegt auf der <b>Daumenseite</b>.<br>Das <b>Schienbein</b> ist der dicke Knochen vorne – da tragen Fußballer ihre <b>Schienbein</b>schoner. Das dünne <b>Wadenbein</b> liegt außen, an der Seite der <b>Wade</b>.<br>Das <b>Schlüsselbein</b> liegt vorne wie ein Bügel vom Hals zur Schulter. Das <b>Schulterblatt</b> ist flach wie ein Blatt und liegt <b>hinten</b>.' },
        { t: 'stolper', st: 'S8', h: 'Auf deinem Skelettblatt waren diese Namen noch nicht ganz richtig – jetzt weißt du es:<br>✗ Oberbein → ✓ <b>Oberschenkelknochen</b><br>✗ Wirbelbein → ✓ <b>Wadenbein</b> (Wirbel gibt es nur in der Wirbelsäule)<br>✗ Fußknochen → ✓ <b>Fußwurzelknochen</b><br>✗ Brust → ✓ <b>Brustbein</b><br>Bei den beiden „Sch…“-Kästchen an der Schulter: vorne oben = <b>Schlüsselbein</b>, an der Schulter Richtung Rücken = <b>Schulterblatt</b>. Und <b>Schädel</b> schreibt man mit ä.' },
        { t: 'h', h: 'Der größte und der kleinste Knochen' },
        { t: 'p', h: 'Der <b>größte Knochen</b> ist der <b>Oberschenkelknochen</b>. In deinem ganzen Oberschenkel steckt nur ein großer Knochen. Viele kleine Knochen haben wir in den <b>Händen und Füßen</b>.' },
        { t: 'p', h: 'Der <b>kleinste Knochen</b> steckt im <b>Ohr</b>. Im Heft heißt er <b>Gehörknöchelchen</b>. Genauer: Im <b>Mittelohr</b> liegen drei Gehörknöchelchen – Hammer, Amboss und <b>Steigbügel</b>. Der <b>Steigbügel</b> ist der allerkleinste, kleiner als ein Reiskorn.' },
        { t: 'diag', id: 'ohr', cap: 'Das Ohr: Der Steigbügel liegt im Mittelohr, hinter dem Trommelfell.' },
        { t: 'stolper', st: 'S3', h: 'Kleinster Knochen = <b>Gehörknöchelchen im Ohr</b> (genauer: der <b>Steigbügel</b> im Mittelohr). Nicht im kleinen Finger und nicht im kleinen Zeh!' },
        { t: 'h', h: 'Fest – und trotzdem beweglich' },
        { t: 'p', h: 'Unsere Knochen sind sehr <b>fest und starr</b>, damit sie dem Körper Halt geben können. Damit wir uns trotzdem bewegen können, haben wir <b>Gelenke</b>: Immer dort, wo zwei Knochen aufeinandertreffen, bilden sie ein Gelenk.', s: 'H2 S.3' },
        { t: 'p', h: 'An Skelettmodellen sind die Knochen zusammengeschraubt. In deinem Körper gibt es keine Schrauben: <b>Muskeln, Sehnen und Bänder</b> halten die Knochen zusammen und bewegen sie.', s: 'H1 S.17' },
        { t: 'alltag', h: 'Tast mal nach: Dein <b>Schlüsselbein</b> fühlst du vorne unter dem Hals. Die <b>Kniescheibe</b> kannst du bei lockerem Bein leicht hin- und herschieben. Dein <b>Schienbein</b> spürst du vorne am Unterschenkel direkt unter der Haut.' },
        { t: 'tryit', h: 'Zeig an deinem eigenen Körper (oder einem Erwachsenen): Schädel, Schlüsselbein, Schulterblatt, Brustbein, Rippen, Wirbelsäule, Becken, Oberarmknochen, Elle, Speiche, Oberschenkelknochen, Kniescheibe, Schienbein, Wadenbein.' }

        { t: 'heft', h: 'Bild „Die Wirbelsäule in Seitenansicht“: 1. Halswirbel: Atlas · 2. Halswirbel: Axis · 7 Halswirbel · 12 Brustwirbel · Bandscheiben · 5 Lendenwirbel · 5 verwachsene Wirbel im Kreuzbein · 4–5 verkümmerte im Steißbein.', s: 'H2 S.1' },

        { t: 'diag', id: 'organe', cap: 'Die 8 Organe aus deinem Heft. Tippe auf ein Organ.' },
        { t: 'cards', organ: true, items: [

          ['❤️', 'Herz', '„Ich versorge den ganzen Körper mit Blut. Du kannst dir mich wie eine Pumpe vorstellen.“', 'Besteht aus Muskeln. Zusammenziehen und Entspannen = Herzschlag. Liegt im Brustkorb (etwas links), die Rippen schützen es.'],
          ['🌬️', 'Lunge', '„Ich versorge den Körper mit Sauerstoff. Ohne mich könntest du nicht atmen.“', 'Sitzt im Brustkorb und besteht aus zwei Lungenflügeln. Über die Adern in der Lunge kommt der Sauerstoff ins Blut.'],
          ['🍽️', 'Magen', '„Bei mir landet das Essen, das du isst. Mit meinen Muskeln knete ich das Essen zu einem Brei.“', 'Die Magensäure hilft beim Zerkleinern.'],
          ['🌀', 'Darm', '„Ich verdaue den Speisebrei und trenne Abfallstoffe und Nährstoffe.“', 'Besteht aus Dünndarm und Dickdarm. Die Nährstoffe gehen ins Blut, die Abfallstoffe werden ausgeschieden.'],
          ['🟤', 'Leber', '„Ich säubere das Blut. Abfallstoffe und giftige Stoffe hole ich aus dem Blut.“', 'Speichert Nährstoffe wie Zucker und Vitamine. Kann giftige Stoffe wie Alkohol teilweise umwandeln.'],
          ['🥜', 'Nieren', '„Wir filtern das Blut und ziehen Wasser aus dem Blut. In uns bildet sich Urin.“', 'Ziehen alles heraus, was der Körper nicht mehr braucht oder was schädlich ist. Der Urin geht zur Blase. Sie sorgen dafür, dass immer gleich viel Wasser im Körper ist.'],

        { t: 'stolper', st: 'S9', h: 'Im Organ-Puzzle sind die Texte von <b>Magen</b> und <b>Darm</b> vertauscht. Richtig:<br>🍽️ <b>Magen</b>: „Bei mir landet das Essen … Mit meinen Muskeln knete ich das Essen zu einem Brei.“<br>🌀 <b>Darm</b>: „Ich verdaue den Speisebrei und trenne Abfallstoffe und Nährstoffe.“' },
        { t: 'stolper', st: 'S5', h: '<b>Nieren oder Leber?</b> Beide helfen, das Blut sauber zu halten – aber unterschiedlich:<br>🥜 <b>Nieren</b>: <b>filtern</b> das Blut, bilden <b>Urin</b>, regeln das <b>Wasser</b> im Körper.<br>🟤 <b>Leber</b>: wandelt <b>giftige Stoffe</b> um und <b>speichert</b> Zucker und Vitamine.' },
        { t: 'esel', h: '<b>N</b>iere → <b>N</b>ass: Die Nieren machen Urin und regeln das Wasser.<br><b>L</b>eber → <b>L</b>ager: Die Leber lagert (speichert) Zucker und Vitamine und entgiftet.' },
        { t: 'achtung', h: 'Im Heft steht bei der Leber: „Alle Abfallstoffe … hole ich aus dem Blut.“ Genauer: Die Leber wandelt giftige Stoffe so um, dass der Körper sie loswerden kann. Viele Abfallstoffe filtern dann die <b>Nieren</b> aus dem Blut – sie landen im <b>Urin</b>.' },
        { t: 'achtung', h: 'Im Heft steht: Das Herz liegt „auf der linken Seite“. Genauer: Es liegt fast in der <b>Mitte</b> der Brust, ein bisschen nach <b>links</b> verschoben.' },

      ]

        { t: 'diag', id: 'kreislauf', cap: 'Der Blutkreislauf: Die Punkte zeigen, wie das Blut fließt.' },

        { t: 'h', h: 'Zahlen vom Arbeitsblatt' },
        { t: 'zahlen', items: [

        { t: 'heft', h: '„Die Lunge ist dein Atmungsorgan und arbeitet ganz automatisch. Wenn du ganz ruhig bist, macht sie mit Hilfe des <b>Zwerchfells 15 bis 20 Atemzüge pro Minute</b>.“ – „Die Lunge arbeitet wie ein <b>Blasebalg</b>.“', s: 'H1 S.6, S.3' },

        { t: 'achtung', h: '15–20 Atemzüge ist ein <b>Richtwert</b> aus dem Heft. Kinder atmen in Ruhe oft etwas schneller als Erwachsene, und jeder Mensch ist ein bisschen anders.' },

        { t: 'achtung', h: 'Deine gemessenen Zahlen sind <b>deine eigenen Messwerte</b>. Bei anderen Kindern können sie anders sein – sie sind keine festen Zahlen zum Auswendiglernen. Wichtig ist der Zusammenhang: <b>mehr Anstrengung → mehr Atemzüge</b>.' }

  /* ================= Übungsrunde (Training, Bildquiz, Fehler, Katalog) ================= */
  function runQuestions(cfg) {

        bar(pct(i, list.length), KMAP[q.k].color) + '<div class="qhost"></div><div class="rfoot"><button class="btn ghost" data-a="skip">Überspringen</button><button class="btn primary" data-a="check">Prüfen</button></div></div>';

      function next() { i++; if (cfg.onProgress) cfg.onProgress(i); step(); window.scrollTo(0, 0); }
      btnS.addEventListener('click', function () { if (!done) results.push({ q: q, status: 'skip', score: 0 }); next(); });

        btnC.focus();

  function examSet(n) {
    var per = n <= 12 ? 1 : (n <= 24 ? 2 : 3), out = [];
    KAP.forEach(function (k) {
      var pool = shuffle(qsOf(k.id).filter(function (q) { return q.t !== 'find'; }));
      var texts = pool.filter(function (q) { return q.t === 'text'; }), imgs = pool.filter(function (q) { return q.auto || q.t === 'label'; });
      var closed = pool.filter(function (q) { return q.t !== 'text' && !q.auto && q.t !== 'label'; });
      var take = closed.slice(0, per);
      if (imgs.length && Math.random() < 0.45) take[take.length - 1] = imgs[0]; // höchstens eine Bildfrage pro Kapitel
      if (texts.length && Math.random() < (per >= 2 ? 0.55 : 0.3)) take[0] = texts[0];
      take.forEach(function (q) { if (q && out.indexOf(q) < 0) out.push(q); });
    });
    var rest = shuffle(QS.filter(function (q) { return out.indexOf(q) < 0 && q.auto && q.t !== 'find'; })).concat(shuffle(QS.filter(function (q) { return out.indexOf(q) < 0 && !q.auto; })));
    while (out.length < n && rest.length) out.push(rest.pop());
    out = out.slice(0, n);
    out.sort(function (a, b) { return KAP.indexOf(KMAP[a.k]) - KAP.indexOf(KMAP[b.k]); });

    var cur = 0, curL = 0, raf = null;
    function place(l) { var pt = path.getPointAtLength(l); ban.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')'); }
    function list() {
      $('.bsteps', f).innerHTML = st.map(function (s, k) { return '<li class="' + (k === cur ? 'on' : (k < cur ? 'done' : '')) + '"><b>' + s[1] + '</b>' + (k === cur ? '<p>' + s[2] + '</p>' : '') + '</li>'; }).join('');
      A.ui.highlight(svg, 'verdauung', st[cur][0], { dim: false });

      k = Math.max(0, Math.min(st.length - 1, k)); var from = curL, to = pos[k], t0 = null; cur = k; list();

      raf = requestAnimationFrame(step);

    $('[data-a=prev]', f).addEventListener('click', function () { go(cur - 1); });
    place(0); list();
  };
